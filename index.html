<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Route + WEIGHT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }

        .panel {
            position: absolute; top: 10px; left: 10px; width: 340px;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 1000;
            font-size: 14px;
        }
        .btn { padding: 8px 12px; margin: 5px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; }
        .btn-blue { background: #007bff; color: white; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-orange { background: #fd7e14; color: white; }
        .btn-purple { background: #6f42c1; color: white; }

        .site { background: #f8f9fa; padding: 8px; margin: 5px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .site input { border: none; background: none; flex: 1; }
        .site button { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; }

        .blocked { stroke: #dc3545; stroke-width: 5; stroke-dasharray: 10,5; fill: none; }
        .weight-label { background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; pointer-events: none; }

        .marker-hq { background: #28a745; color: white; width: 36px; height: 36px; border-radius: 50%; text-align: center; line-height: 36px; font-weight: bold; font-size: 15px; }
        .marker-site { background: #dc3545; color: white; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 30px; font-weight: bold; font-size: 13px; }
        .marker-vehicle { background: #007bff; color: white; width: 34px; height: 34px; border-radius: 50%; text-align: center; line-height: 34px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }

        .route { stroke: #007bff; stroke-width: 4; fill: none; }
        .hull { fill: rgba(255,0,0,0.1); stroke: #dc3545; stroke-width: 3; stroke-dasharray: 5,5; }

        .msg { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 1000; display: none; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="panel">
    <h3 style="margin-bottom:10px; text-align:center; color:#333;">Rescue Route + WEIGHT</h3>

    <div id="baseInfo" style="margin-bottom:10px; color:#28a745; font-weight:bold;"></div>

    <div id="sites"></div>

    <button class="btn btn-red" onclick="clearAll()">Clear All</button>

    <hr style="margin:10px 0;">

    <button class="btn btn-purple" onclick="startBlock()">Block Road (Click 2 Points)</button>
    <button class="btn btn-blue" onclick="optimize()">Optimize Route</button>
    <button class="btn btn-green" onclick="showZone()">Show Urgent Zone</button>
    <button class="btn btn-orange" onclick="simulateHazards()">Simulate Hazards</button>

    <div style="margin-top:10px;">
        <label>Time: <span id="time">0</span></label>
        <input type="range" min="0" max="4" value="0" style="width:100%;" id="timeSlider">
    </div>

    <label><input type="checkbox" id="showWeights" checked> Show Weights on Map</label>
</div>

<div id="msg" class="msg"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// === GLOBALS ===
let map, hq = null, vehicle = null, route = null, zone = null;
let sites = [], siteMarkers = [];
let graph = {};
let blocking = false, blockPoints = [], blockLines = [];
let weightLabels = [];

// === INIT ===
function init() {
    map = L.map('map').setView([28.6139, 77.2090], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    map.on('click', function(e) {
        if (blocking) {
            addBlockPoint(e.latlng);
        } else if (!hq) {
            addHQ(e.latlng);
        } else {
            addSite(e.latlng);
        }
    });

    document.getElementById('timeSlider').oninput = function() {
        document.getElementById('time').innerText = this.value;
        if (route) optimize();
    };

    document.getElementById('showWeights').onchange = function() {
        if (this.checked) showAllWeights();
        else clearWeightLabels();
    };

    for (let t = 0; t <= 4; t++) graph[t] = {};
}
init();

// === ADD HQ ===
function addHQ(pos) {
    hq = L.marker(pos, { icon: L.divIcon({ className: 'marker-hq', html: 'HQ' }) }).addTo(map);
    document.getElementById('baseInfo').innerHTML = `Base: ${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}`;
    showMsg('Base set! Click to add sites.');
}

// === ADD SITE ===
function addSite(pos) {
    const num = sites.length + 1;
    const m = L.marker(pos, { icon: L.divIcon({ className: 'marker-site', html: num }) }).addTo(map);
    siteMarkers.push(m);
    sites.push({ lat: pos.lat, lng: pos.lng, name: `Site ${num}` });
    updateSiteList();
    if (document.getElementById('showWeights').checked) showAllWeights();
}

// === BLOCK MODE ===
function startBlock() {
    blocking = true;
    blockPoints = [];
    showMsg('Click 2 points to BLOCK road!', 5000);
    map.getContainer().style.cursor = 'crosshair';
}

function addBlockPoint(pos) {
    blockPoints.push(pos);
    if (blockPoints.length === 2) {
        const line = L.polyline(blockPoints, { className: 'blocked' }).addTo(map);
        blockLines.push(line);
        blocking = false;
        map.getContainer().style.cursor = '';
        showMsg('Road BLOCKED!', 3000);
        if (document.getElementById('showWeights').checked) showAllWeights();
    }
}

// === UPDATE LIST ===
function updateSiteList() {
    const list = document.getElementById('sites');
    list.innerHTML = '';
    sites.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'site';
        div.innerHTML = `
            <input value="${s.name}" onchange="sites[${i}].name=this.value">
            <button onclick="removeSite(${i})">X</button>
        `;
        list.appendChild(div);
    });
}

function removeSite(i) {
    map.removeLayer(siteMarkers[i]);
    siteMarkers.splice(i, 1);
    sites.splice(i, 1);
    updateSiteList();
    siteMarkers.forEach((m, j) => m.setIcon(L.divIcon({ className: 'marker-site', html: j+1 })));
    if (document.getElementById('showWeights').checked) showAllWeights();
}

function clearAll() {
    if (hq) map.removeLayer(hq); hq = null;
    siteMarkers.forEach(m => map.removeLayer(m));
    blockLines.forEach(l => map.removeLayer(l));
    clearWeightLabels();
    siteMarkers = []; sites = []; blockLines = []; blockPoints = [];
    document.getElementById('baseInfo').innerHTML = '';
    updateSiteList();
    clearLayers();
    showMsg('All cleared!');
}

function clearLayers() {
    if (route) map.removeLayer(route);
    if (vehicle) map.removeLayer(vehicle);
    if (zone) map.removeLayer(zone);
    route = vehicle = zone = null;
}

// === DISTANCE ===
function dist(p1, p2) {
    const R = 6371;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(p2.lat - p1.lat);
    const dLon = toRad(p2.lng - p1.lng);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// === IS BLOCKED? ===
function isBlocked(i, j) {
    if (blockLines.length === 0) return false;
    const p1 = i === 0 ? hq.getLatLng() : siteMarkers[i-1].getLatLng();
    const p2 = j === 0 ? hq.getLatLng() : siteMarkers[j-1].getLatLng();
    for (let line of blockLines) {
        const [b1, b2] = line.getLatLngs();
        if (pointsMatch(p1, b1) && pointsMatch(p2, b2)) return true;
        if (pointsMatch(p1, b2) && pointsMatch(p2, b1)) return true;
    }
    return false;
}

function pointsMatch(a, b) {
    return Math.abs(a.lat - b.lat) < 0.0001 && Math.abs(a.lng - b.lng) < 0.0001;
}

// === BUILD GRAPH + SHOW WEIGHTS ===
function buildGraph(t) {
    const g = graph[t];
    const points = [hq.getLatLng(), ...siteMarkers.map(m => m.getLatLng())];
    
    // Clear old labels
    clearWeightLabels();

    points.forEach((p1, i) => {
        g[i] = {};
        points.forEach((p2, j) => {
            if (i === j) return;
            let d = dist(p1, p2);
            if (isBlocked(i, j)) {
                d = Infinity;
            } else {
                if (t > 0 && Math.random() < 0.3) d += 20;
                if (t > 2 && Math.random() < 0.2) d = Math.max(0.5, d - 3);
            }
            g[i][j] = d;

            // ADD LABEL ON MAP
            if (document.getElementById('showWeights').checked) {
                const mid = [(p1.lat + p2.lat)/2, (p1.lng + p2.lng)/2];
                const text = d === Infinity ? '∞' : d.toFixed(1);
                const label = L.marker(mid, {
                    icon: L.divIcon({
                        className: 'weight-label',
                        html: text,
                        iconSize: [30, 20]
                    })
                }).addTo(map);
                weightLabels.push(label);
            }
        });
    });
}

function clearWeightLabels() {
    weightLabels.forEach(l => map.removeLayer(l));
    weightLabels = [];
}

function showAllWeights() {
    clearWeightLabels();
    const t = document.getElementById('timeSlider').value;
    buildGraph(t); // Rebuild to show labels
}

// === TSP ===
function tsp() {
    if (!hq || sites.length === 0) return null;
    const t = document.getElementById('timeSlider').value;
    buildGraph(t);
    const g = graph[t];
    const n = sites.length + 1;
    const path = [0], visited = new Array(n).fill(false); visited[0] = true;
    let cur = 0;

    for (let i = 0; i < n-1; i++) {
        let min = Infinity, next = null;
        for (let j = 0; j < n; j++) {
            if (!visited[j] && g[cur][j] < min) { min = g[cur][j]; next = j; }
        }
        if (next === null || min === Infinity) return null;
        path.push(next); visited[next] = true; cur = next;
    }
    path.push(0);
    return path;
}

// === OPTIMIZE ===
function optimize() {
    if (!hq || sites.length === 0) return showMsg('Add base & sites first!', 3000);
    clearLayers();

    const order = tsp();
    if (!order) return showMsg('No path! (Blocked roads?)', 4000);

    const points = [hq.getLatLng(), ...siteMarkers.map(m => m.getLatLng())];
    const coords = order.map(i => [points[i].lat, points[i].lng]);

    route = L.polyline(coords, { className: 'route' }).addTo(map);
    map.fitBounds(route.getBounds());

    vehicle = L.marker(coords[0], { icon: L.divIcon({ className: 'marker-vehicle', html: 'Truck' }) }).addTo(map);
    let i = 0;
    const move = setInterval(() => {
        if (i >= coords.length) { clearInterval(move); return; }
        vehicle.setLatLng(coords[i++]);
    }, 800);

    showMsg(`Route ready! ${sites.length} sites.`, 4000);
}

// === CONVEX HULL ===
function showZone() {
    if (zone) map.removeLayer(zone);
    if (sites.length < 3) return showMsg('Need 3+ sites!', 3000);
    const pts = sites.map(p => [p.lat, p.lng]);
    const hull = convexHull(pts);
    zone = L.polygon(hull.map(p => [p[0], p[1]]), { className: 'hull' }).addTo(map);
    showMsg('Urgent Zone shown!', 3000);
}

function convexHull(pts) {
    if (pts.length < 3) return pts;
    const start = pts.reduce((a,b) => a[1] < b[1] || (a[1]===b[1] && a[0]<b[0]) ? a : b);
    const sorted = pts.slice().sort((a,b) => {
        const ang = Math.atan2(a[1]-start[1], a[0]-start[0]) - Math.atan2(b[1]-start[1], b[0]-start[0]);
        return ang !== 0 ? ang : ((a[0]-start[0])**2 + (a[1]-start[1])**2) - ((b[0]-start[0])**2 + (b[1]-start[1])**2);
    });
    const hull = [sorted[0], sorted[1]];
    for (let i = 2; i < sorted.length; i++) {
        while (hull.length >= 2 && cross(hull[hull.length-2], hull[hull.length-1], sorted[i]) <= 0) hull.pop();
        hull.push(sorted[i]);
    }
    return hull;
}
function cross(o, a, b) { return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }

// === HAZARDS ===
function simulateHazards() {
    const t = document.getElementById('timeSlider').value;
    buildGraph(t);
    showMsg(`Hazards updated for stage ${t}`, 3000);
    if (document.getElementById('showWeights').checked) showAllWeights();
}

// === MSG ===
function showMsg(text, time = 3000) {
    const msg = document.getElementById('msg');
    msg.innerText = text;
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', time);
}
</script>

</body>
</html>
