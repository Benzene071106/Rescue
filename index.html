<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Route - Scroll Panels</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; }

        #map { height: 100vh; width: 100%; }

        /* LEFT PANEL - Only 4 sites visible + scroll */
        .panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 340px;
            background: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 14px;
            max-height: 90vh;
            overflow: hidden;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .panel h3 { margin-bottom: 10px; text-align: center; color: #333; font-size: 16px; }

        /* Sites list container - fixed height, scrollable */
        #sites-container {
            max-height: 180px; /* ~4 sites */
            overflow-y: auto;
            padding-right: 8px;
            margin: 8px 0;
        }
        #sites-container::-webkit-scrollbar { width: 6px; }
        #sites-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
        #sites-container::-webkit-scrollbar-thumb { background: #aaa; border-radius: 3px; }

        .site {
            background: #f1f3f5;
            padding: 9px;
            margin: 6px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border: 1px solid #ddd;
        }
        .site input { border: none; background: none; flex: 1; font-weight: 500; }
        .site button {
            background: #dc3545; color: white; border: none;
            padding: 5px 9px; border-radius: 6px; font-size: 12px; cursor: pointer;
        }

        .btn {
            padding: 9px 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
        .btn-blue { background: #007bff; color: white; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-orange { background: #fd7e14; color: white; }
        .btn-purple { background: #6f42c1; color: white; }

        /* RIGHT PANEL - Weight Table */
        .weight-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 380px;
            background: rgba(20, 25, 35, 0.88);
            color: #e0f7ff;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            z-index: 1000;
            font-size: 13px;
            max-height: 90vh;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 120, 255, 0.3);
        }
        .weight-panel h3 {
            margin-bottom: 12px; text-align: center; color: #00aaff; font-size: 16px;
        }

        /* Table container - SIRF 3 ROWS DIKHAO + SCROLLBAR */
        #table-container {
            max-height: 120px;   /* <-- YEH CHANGE: Sirf 3 rows */
            overflow-y: auto;
            padding-right: 4px;
        }
        #table-container::-webkit-scrollbar { width: 6px; }
        #table-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        #table-container::-webkit-scrollbar-thumb { background: #00aaff; border-radius: 3px; }

        #weightTable {
            width: 100%; border-collapse: collapse; font-size: 12.5px;
        }
        #weightTable th, #weightTable td {
            border: 1px solid rgba(0, 170, 255, 0.3);
            padding: 6px 8px; text-align: center;
        }
        #weightTable th {
            background: rgba(0, 90, 180, 0.7); color: #fff; font-weight: bold;
            position: sticky; top: 0; z-index: 1;
        }
        #weightTable td {
            background: rgba(30, 40, 60, 0.6);
        }
        #weightTable tr:hover td { background: rgba(0, 120, 255, 0.25); }

        /* MARKERS */
        .marker-hq {
            background: #28a745; color: white; width: 38px; height: 38px;
            border-radius: 50%; text-align: center; line-height: 38px;
            font-weight: bold; font-size: 16px; border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .marker-site {
            background: #dc3545; color: black; width: 32px; height: 32px;
            border-radius: 50%; text-align: center; line-height: 32px;
            font-weight: bold; font-size: 14px; border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .marker-vehicle {
            background: #007bff; color: white; width: 36px; height: 36px;
            border-radius: 50%; text-align: center; line-height: 36px;
            animation: pulse 1.5s infinite;
            font-size: 18px;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }

        .site-name-label div {
            margin-top: 6px; white-space: nowrap; font-weight: bold;
            color: #222; background: rgba(255,255,255,0.9);
            padding: 2px 6px; border-radius: 4px; font-size: 12px;
        }

        .blocked { stroke: #ff4444; stroke-width: 5; stroke-dasharray: 10,5; fill: none; }
        .route { stroke: #00aaff; stroke-width: 5; fill: none; }
        .hull { fill: rgba(255,0,0,0.15); stroke: #ff5555; stroke-width: 3; stroke-dasharray: 6,6; }

        .msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); color: white; padding: 16px 28px;
            border-radius: 12px; font-size: 16px; font-weight: bold;
            z-index: 2000; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            display: none; max-width: 80%;
        }
        .msg.show { display: block; animation: fade 0.4s; }
        @keyframes fade { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }
    </style>
</head>
<body>

<div id="map"></div>

<!-- LEFT PANEL -->
<div class="panel">
    <h3>Rescue Route Control</h3>
    <div id="baseInfo" style="margin-bottom:10px; color:#28a745; font-weight:bold;"></div>

    <!-- Scrollable Sites List (Max 4 visible) -->
    <div id="sites-container">
        <div id="sites"></div>
    </div>

    <button class="btn btn-red" onclick="clearAll()">Clear All</button>
    <hr style="margin:10px 0;">
    <button class="btn btn-purple" onclick="startBlock()">Block Road (Click 2 Points)</button>
    <button class="btn btn-blue" onclick="optimize()">Optimize Route</button>
    <button class="btn btn-green" onclick="showZone()">Show Urgent Zone</button>
    <button class="btn btn-orange" onclick="simulateHazards()">Simulate Hazards</button>

    <div style="margin-top:12px;">
        <label>Time Stage: <span id="time">0</span></label>
        <input type="range" min="0" max="4" value="0" style="width:100%;" id="timeSlider">
    </div>
</div>

<!-- RIGHT PANEL - Weight Table -->
<div class="weight-panel">
    <h3>Distance Matrix (km)</h3>
    <div id="table-container">
        <table id="weightTable"></table>
    </div>
</div>

<!-- POPUP MESSAGE -->
<div id="msg" class="msg"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ============================ GLOBALS ============================ */
let map, hq = null, vehicle = null, route = null, zone = null;
let sites = [], siteMarkers = [], siteNameLayers = [];
let graph = {};
let blocking = false, blockPoints = [], blockLines = [];
let clickCount = 0;

/* ============================ INIT ============================ */
function init() {
    map = L.map('map').setView([28.6139, 77.2090], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    showPopup("First click is your Headquarters");

    map.on('click', e => {
        if (blocking) return addBlockPoint(e.latlng);
        clickCount++;
        if (clickCount === 1) {
            addHQ(e.latlng);
            hidePopup();
            showPopup("Rest clicks are for Critical Sites");
        } else if (clickCount === 2) {
            addSite(e.latlng);
            hidePopup();
        } else {
            addSite(e.latlng);
        }
    });

    document.getElementById('timeSlider').oninput = function () {
        document.getElementById('time').innerText = this.value;
        if (route) optimize();
        rebuildWeightTable();
    };

    for (let t = 0; t <= 4; t++) graph[t] = {};
}
init();

/* ============================ POPUP ============================ */
function showPopup(text) {
    const msg = document.getElementById('msg');
    msg.innerText = text;
    msg.classList.add('show');
}
function hidePopup() {
    document.getElementById('msg').classList.remove('show');
}

/* ============================ HQ & SITE ============================ */
function addHQ(pos) {
    hq = L.marker(pos, { icon: L.divIcon({ className: 'marker-hq', html: 'HQ' }) }).addTo(map);
    document.getElementById('baseInfo').innerHTML = `HQ: ${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}`;
    rebuildWeightTable();
}

function addSite(pos) {
    const idx = sites.length;
    const num = idx + 1;
    const name = `Site ${num}`;

    const m = L.marker(pos, { icon: L.divIcon({ className: 'marker-site', html: num }) }).addTo(map);
    siteMarkers.push(m);

    const label = L.marker(pos, {
        icon: L.divIcon({
            className: 'site-name-label',
            html: `<div>${name}</div>`,
            iconAnchor: [0, -6]
        })
    }).addTo(map);
    siteNameLayers.push(label);

    sites.push({ lat: pos.lat, lng: pos.lng, name });
    updateSiteList();
    rebuildWeightTable();
}

function updateSiteList() {
    const list = document.getElementById('sites');
    list.innerHTML = '';
    sites.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'site';
        div.innerHTML = `
            <input value="${s.name}" onchange="renameSite(${i}, this.value)">
            <button onclick="removeSite(${i})">X</button>
        `;
        list.appendChild(div);
    });
}

function renameSite(i, newName) {
    sites[i].name = newName;
    siteNameLayers[i].setIcon(L.divIcon({
        className: 'site-name-label',
        html: `<div>${newName}</div>`,
        iconAnchor: [0, -6]
    }));
    rebuildWeightTable();
}

function removeSite(i) {
    map.removeLayer(siteMarkers[i]);
    map.removeLayer(siteNameLayers[i]);
    siteMarkers.splice(i, 1);
    siteNameLayers.splice(i, 1);
    sites.splice(i, 1);

    siteMarkers.forEach((m, j) => m.setIcon(L.divIcon({ className: 'marker-site', html: j + 1 })));
    siteNameLayers.forEach((l, j) => l.setIcon(L.divIcon({
        className: 'site-name-label',
        html: `<div>${sites[j].name}</div>`,
        iconAnchor: [0, -6]
    })));

    updateSiteList();
    rebuildWeightTable();
}

/* ============================ BLOCK & CLEAR ============================ */
function startBlock() {
    blocking = true; blockPoints = [];
    showMsg('Click 2 points to BLOCK road!', 5000);
    map.getContainer().style.cursor = 'crosshair';
}

function addBlockPoint(pos) {
    blockPoints.push(pos);
    if (blockPoints.length === 2) {
        const line = L.polyline(blockPoints, { className: 'blocked' }).addTo(map);
        blockLines.push(line);
        blocking = false;
        map.getContainer().style.cursor = '';
        showMsg('Road BLOCKED!', 3000);
        rebuildWeightTable();
    }
}

function clearAll() {
    if (hq) map.removeLayer(hq); hq = null;
    siteMarkers.forEach(m => map.removeLayer(m));
    siteNameLayers.forEach(l => map.removeLayer(l));
    blockLines.forEach(l => map.removeLayer(l));
    clearLayers();

    siteMarkers = []; sites = []; siteNameLayers = [];
    blockLines = []; blockPoints = []; clickCount = 0;

    document.getElementById('baseInfo').innerHTML = '';
    document.getElementById('weightTable').innerHTML = '';
    updateSiteList();
    hidePopup();
    showPopup("First click is your Headquarters");
}

function clearLayers() {
    if (route) map.removeLayer(route);
    if (vehicle) map.removeLayer(vehicle);
    if (zone) map.removeLayer(zone);
    route = vehicle = zone = null;
}

/* ============================ DISTANCE & GRAPH ============================ */
function dist(p1, p2) {
    const R = 6371;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(p2.lat - p1.lat);
    const dLon = toRad(p2.lng - p1.lng);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function isBlocked(i, j) {
    if (!blockLines.length) return false;
    const p1 = i === 0 ? hq.getLatLng() : siteMarkers[i-1].getLatLng();
    const p2 = j === 0 ? hq.getLatLng() : siteMarkers[j-1].getLatLng();
    for (let line of blockLines) {
        const [b1, b2] = line.getLatLngs();
        if ((pointsMatch(p1, b1) && pointsMatch(p2, b2)) || (pointsMatch(p1, b2) && pointsMatch(p2, b1))) return true;
    }
    return false;
}

function pointsMatch(a, b) {
    return Math.abs(a.lat - b.lat) < 0.0001 && Math.abs(a.lng - b.lng) < 0.0001;
}

function buildGraph(t) {
    const g = graph[t] = {};
    const points = [hq.getLatLng(), ...siteMarkers.map(m => m.getLatLng())];

    points.forEach((p1, i) => {
        g[i] = {};
        points.forEach((p2, j) => {
            if (i === j) return;
            let d = dist(p1, p2);
            if (isBlocked(i, j)) d = Infinity;
            else if (t > 0 && Math.random() < 0.3) d += 20;
            else if (t > 2 && Math.random() < 0.2) d = Math.max(0.5, d - 3);
            g[i][j] = d;
        });
    });
}

/* ============================ WEIGHT TABLE ============================ */
function rebuildWeightTable() {
    if (!hq || sites.length === 0) {
        document.getElementById('weightTable').innerHTML = '';
        return;
    }
    const t = document.getElementById('timeSlider').value;
    buildGraph(t);
    const g = graph[t];

    let html = `<tr><th></th><th>HQ</th>${sites.map(s => `<th>${escape(s.name)}</th>`).join('')}</tr>`;

    html += `<tr><td><strong>HQ</strong></td><td>-</td>${Array.from({length:sites.length},(_,j) => {
        const w = g[0][j+1] === Infinity ? 'Infinity' : g[0][j+1].toFixed(1);
        return `<td>${w}</td>`;
    }).join('')}</tr>`;

    sites.forEach((s, i) => {
        const row = [`<td><strong>${escape(s.name)}</strong></td>`];
        const wHQ = g[i+1][0] === Infinity ? 'Infinity' : g[i+1][0].toFixed(1);
        row.push(`<td>${wHQ}</td>`);
        sites.forEach((_, j) => {
            if (i === j) row.push('<td>-</td>');
            else {
                const w = g[i+1][j+1] === Infinity ? 'Infinity' : g[i+1][j+1].toFixed(1);
                row.push(`<td>${w}</td>`);
            }
        });
        html += `<tr>${row.join('')}</tr>`;
    });

    document.getElementById('weightTable').innerHTML = html;
}
function escape(txt) { return txt.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

/* ============================ DUMMY FUNCTIONS (Paste from your working version) ============================ */
function tsp() { alert('TSP not implemented yet!'); }
function optimize() { alert('Route optimization coming soon!'); }
function animateVehicle(pts) { console.log('Animating vehicle along:', pts); }
function showZone() { alert('Showing urgent zone...'); }
function simulateHazards() { alert('Hazards simulated!'); }
function showMsg(txt, duration = 2500) {
    const msg = document.getElementById('msg');
    msg.innerText = txt;
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), duration);
}
</script>

</body>
</html>
